name: Osvezi javne cene

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: demetra-price-update-${{ github.repository }}
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Preuzmi main za upis
        uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Pripremi Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'

      - name: Pripremi Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Proveri polazni katalog
        run: node scripts/check-catalog.mjs

      - name: Proveri logiku osvezavanja cena
        run: python -m unittest discover -s scripts/tests -p 'test_*.py'

      - name: Osvezi cene iz podrzanih izvora
        id: refresh
        run: python scripts/update_prices.py --report "$RUNNER_TEMP/price-update.json"

      - name: Prikazi rezultat provere izvora
        if: always() && steps.refresh.outcome != 'skipped'
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP']) / 'price-update.json'
          if not path.exists():
              print('Izvestaj nije napravljen; proverite prethodni korak.')
          else:
              report = json.loads(path.read_text(encoding='utf-8'))
              labels = {'completed': 'Zavrseno', 'partial_failure': 'Delimicno uspesno', 'failed': 'Provera izvora nije uspela'}
              status = labels.get(report.get('status'), 'Nepoznat status')
              lines = ['## Javne kataloske cene', '', '**Status: ' + status + '**', '', '| Rezultat | Broj |', '| --- | ---: |']
              for label, key in [('URL zahtevi', 'requests'), ('Uspesne provere', 'checked'), ('Promenjene cene ili uslovi', 'updated'), ('Potvrdjeno nepromenjene', 'verifiedUnchanged'), ('Neuspele provere', 'failed'), ('Preskoceno', 'skipped')]:
                  count = report.get(key)
                  count = str(count) if type(count) is int and count >= 0 else 'Nije navedeno'
                  lines.append('| ' + label + ' | ' + count + ' |')
              lines += ['', 'Neuspesne provere cuvaju prethodne podatke. Ova provera ne potvrdjuje lager ni ugovorenu nabavnu cenu.', '']
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
                  summary.write('\n'.join(lines))
              if report.get('status') in ('partial_failure', 'failed'):
                  print('::warning::Neki izvori nisu uspesno provereni. Zadrzani su prethodni podaci; pogledajte Summary.')
          PY

      - name: Proveri osvezen katalog
        run: node scripts/check-catalog.mjs

      - name: Sacuvaj izmenjene podatke
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git add -- data/biljke.json data/rasadnici.json data/kataloske-stavke.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Podaci su nepromenjeni; novi commit nije potreban."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: osvezi javne kataloske cene"
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort
              echo "::error::Paralelna izmena je u konfliktu. Main nije prepisan; ponovite proveru posle razresenja."
              exit 1
            fi
            node scripts/check-catalog.mjs
            if git push origin HEAD:main; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::warning::Push nije uspeo (pokusaj $attempt/3); proveravam novo stanje main."
          done
          echo "::error::Podaci nisu upisani posle tri pokusaja. Proverite Actions dozvole, zastitu main i paralelne izmene."
          exit 1

  # GITHUB_TOKEN commits do NOT trigger the push workflow. Call deployment here.
  publish:
    needs: update
    if: needs.update.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
