name: Render photo-matched PWA assets
on:
  push:
    branches: [fix/pwa-icon-reference-exact-151918-20261117]
    paths:
      - 'assets/icons/icon.svg'
      - 'assets/icons/icon-maskable.svg'
      - '.github/workflows/render-reference-icon.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Generate all icon sizes from photo-matched vectors
        run: |
          python -m pip install --quiet 'cairosvg>=2.7,<3' 'pillow>=11,<13'
          python scripts/generate_pwa_icons.py
      - name: Commit regenerated assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/icons/*.png assets/icons/favicon.ico
          if ! git diff --cached --quiet; then
            git commit -m 'build(pwa): render dark green-black #151918 reference icons'
            git push
          fi
