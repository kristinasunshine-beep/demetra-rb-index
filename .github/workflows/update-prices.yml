name: Cene iz ponuda — online osvezavanje iskljuceno

on:
  workflow_dispatch:

permissions: {}

jobs:
  source-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Prikazi pravilo izvora
        run: |
          echo "## Online osvezavanje cena je iskljuceno" >> "$GITHUB_STEP_SUMMARY"
          echo "Cene, mere, tip sadnice i napomene uzimaju se iskljucivo iz foldera Rasadnici ponude." >> "$GITHUB_STEP_SUMMARY"
          echo "Jedina online automatizacija je Osvezi kataloske fotografije." >> "$GITHUB_STEP_SUMMARY"
