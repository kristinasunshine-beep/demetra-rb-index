name: Proveri jutarnje ažuriranje cena

on:
  workflow_dispatch:
  schedule:
    - cron: '35 7 * * *'

permissions:
  contents: read

jobs:
  verify-price-refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Proveri potvrdu iz poslovnog foldera
        run: node scripts/check-price-sync.mjs
