name: Control Room regression
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify UI integration without replacing catalog data
        run: |
          node --test scripts/tests/test_control_room_ui.mjs
          node scripts/tests/test_photo_reference_render.mjs
          node --check assets/brza-preporuka.js
          node --check assets/moja-ponuda.js
      - name: Run live browser interaction checks
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          node scripts/tests/control-room-browser.mjs
      - name: Diagnose historical plant-offer matching
        run: node scripts/tests/diagnose_archive_matching.mjs
      - name: Validate real catalog and original source policy
        run: |
          python scripts/repair_photo_asset_paths.py
          node scripts/currency-normalization.mjs --repo . --check
          node scripts/check-catalog.mjs
          node --test scripts/tests/test_my_quote.mjs
          node --test scripts/tests/test_quick_recommendation.mjs scripts/tests/test_folder_price_refresh.mjs scripts/tests/test_recommendation_excel_preservation.mjs scripts/tests/test_recommendation_automatic.mjs scripts/tests/test_currency_normalization.mjs
          python -m unittest discover -s scripts/tests -p 'test_source_panel_semantics.py'
          python -m unittest discover -s scripts/tests -p 'test_recover_arbor_catalog.py'
          python scripts/photo_source_policy.py
