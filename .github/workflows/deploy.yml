name: Objavi Demetra katalog

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions: {}

concurrency:
  group: demetra-pages-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Preuzmi najnoviji main
        uses: actions/checkout@v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Pripremi Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Pripremi Python za oporavak fotografija
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'

      - name: Vrati proverene fotografije pre objave
        run: python scripts/repair_photo_asset_paths.py

      - name: Proveri katalog i povezane fajlove
        run: |
          node scripts/check-catalog.mjs
          python scripts/photo_source_policy.py

      - name: Pripremi GitHub Pages
        uses: actions/configure-pages@v6.0.0

      - name: Izdvoji samo javne fajlove sajta
        shell: bash
        env:
          PAGES_UPLOAD_DIR: ${{ runner.temp }}/demetra-pages
        run: |
          set -euo pipefail

          mkdir -p "$PAGES_UPLOAD_DIR/data"

          cp -- index.html "$PAGES_UPLOAD_DIR/"
          cp -- data/biljke.json data/rasadnici.json data/kataloske-stavke.json "$PAGES_UPLOAD_DIR/data/"

          for directory in assets fonts; do
            if [[ -d "$directory" ]]; then
              cp -R -- "$directory" "$PAGES_UPLOAD_DIR/$directory"
            fi
          done

      - name: Prenesi fajlove za objavljivanje
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: ${{ runner.temp }}/demetra-pages
          retention-days: 1

      - name: Objavi sajt
        id: deployment
        uses: actions/deploy-pages@v5.0.1
