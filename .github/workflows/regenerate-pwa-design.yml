name: Re-render PWA icon bitmaps
on:
  push:
    branches: [design/pwa-white-icons-barlow-mobile-20261117]
    paths:
      - 'assets/icons/icon.svg'
      - 'assets/icons/icon-maskable.svg'
      - '.github/workflows/regenerate-pwa-design.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Generate icons from latest vector geometry
        run: |
          python -m pip install --quiet 'cairosvg>=2.7,<3' 'pillow>=11,<13'
          python scripts/generate_pwa_icons.py
      - name: Commit the new PNG and ICO files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/icons/*.png assets/icons/favicon.ico
          if ! git diff --cached --quiet; then
            git commit -m 'design(pwa): remove decorative border from regenerated icons'
            git push
          fi
