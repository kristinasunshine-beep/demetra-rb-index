name: Uvezi pregledanu ponudu Jugoslav

on:
  push:
    branches: [main]
    paths:
      - 'docs/import-jugoslav-2026-08.json'
      - 'scripts/import-reviewed-jugoslav.mjs'
      - '.github/workflows/import-jugoslav.yml'
  workflow_dispatch:

permissions: {}

concurrency:
  group: demetra-reviewed-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Uvezi i proveri identitete, izvorne mere, cene
        run: |
          node scripts/import-reviewed-jugoslav.mjs
          node scripts/currency-normalization.mjs --repo . --check
          node scripts/check-catalog.mjs
          node --test scripts/tests/test_quick_recommendation.mjs
      - name: Upiši pregledani katalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/biljke.json data/kataloske-stavke.json scripts/catalog-scope.json scripts/price-sources.json
          if ! git diff --cached --quiet; then
            git commit -m "Import reviewed Jugoslav nursery offers from August 2026"
            git push origin HEAD:main
          fi
  publish:
    needs: import
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
