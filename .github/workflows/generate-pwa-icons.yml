name: Generate and commit branded PWA icon raster assets
on:
  push:
    branches: [feat/pwa-icons-mobile-outline-20261117]
    paths:
      - 'assets/icons/*.svg'
      - 'scripts/generate_pwa_icons.py'
      - '.github/workflows/generate-pwa-icons.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-icons:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Generate faithful raster icons
        run: |
          python -m pip install --quiet 'cairosvg>=2.7,<3' 'pillow>=11,<13'
          python scripts/generate_pwa_icons.py
      - name: Commit generated files to this branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/icons/*.png assets/icons/favicon.ico
          if git diff --cached --quiet; then
            echo 'No icon changes'
            exit 0
          fi
          git commit -m 'build(pwa): commit responsive PNG and ICO icon variants'
          git push
