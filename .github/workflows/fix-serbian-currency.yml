name: Ispravka RSD cenovnika Žića i Topalović
on:
  push:
    paths:
      - 'scripts/fix_serbian_nursery_currency.py'
      - '.github/workflows/fix-serbian-currency.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  correct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Correct source currency and validate all 97 price records
        run: python scripts/fix_serbian_nursery_currency.py
      - name: Commit corrected catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/kataloske-stavke.json
          if ! git diff --cached --quiet; then
            git commit -m "Fix EUR display of 66 RSD nursery prices"
            git push
          fi
