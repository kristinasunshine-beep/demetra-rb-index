name: Osvezi kataloske fotografije

on:
  schedule:
    - cron: '47 4 * * 1'
  workflow_dispatch:

permissions: {}

# Ista grupa cuva kompatibilnost sa ranijim poslovima osvezavanja.
concurrency:
  group: demetra-price-update-${{ github.repository }}
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: write

    outputs:
      changed: ${{ steps.commit.outputs.changed }}

    env:
      PYTHONDONTWRITEBYTECODE: '1'

    steps:
      - name: Preuzmi main za upis
        uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Pripremi Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'

      - name: Instaliraj proverenu verziju biblioteke za slike
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: 'Pillow==13.0.0'

      - name: Pripremi Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Proveri polazni katalog
        run: node scripts/check-catalog.mjs

      - name: Proveri logiku osvezavanja fotografija
        shell: bash
        run: |
          set -euo pipefail
          test -f scripts/tests/test_update_photos.py
          python -m unittest discover -s scripts/tests -p 'test_update_photos.py'
          python -m unittest discover -s scripts/tests -p 'test_source_policy.py'

      - name: Osvezi fotografije iz potvrdjenih izvora
        id: refresh
        run: python scripts/update_photos.py --report "$RUNNER_TEMP/photo-update.json"

      - name: Prikazi rezultat provere fotografija
        if: always() && steps.refresh.outcome != 'skipped'
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(os.environ['RUNNER_TEMP']) / 'photo-update.json'
          lines = ['## Kataloske fotografije', '']

          if not path.is_file():
              lines.append('Izvestaj nije napravljen; proverite prethodni korak.')
          else:
              report = json.loads(path.read_text(encoding='utf-8'))
              labels = {
                  'completed': 'Zavrseno',
                  'partial_failure': 'Delimicno uspesno',
                  'failed': 'Provera izvora nije uspela',
                  'configuration_or_data_error': 'Greska konfiguracije ili podataka'
              }
              lines += [
                  '**Status: ' + labels.get(report.get('status'), 'Nepoznat status') + '**',
                  '',
                  '| Rezultat | Broj |',
                  '| --- | ---: |'
              ]
              for label, key in [
                  ('URL zahtevi', 'requests'),
                  ('Uspesne provere', 'checked'),
                  ('Osvezene fotografije', 'updated'),
                  ('Dodate fotografije', 'added'),
                  ('Potvrdjeno nepromenjene', 'verifiedUnchanged'),
                  ('Neuspele provere', 'failed'),
                  ('Preskoceno', 'skipped')
              ]:
                  count = report.get(key)
                  value = str(count) if type(count) is int and count >= 0 else 'Nije navedeno'
                  lines.append('| ' + label + ' | ' + value + ' |')
              lines += [
                  '',
                  'Neuspesne provere cuvaju prethodnu fotografiju i podatke. '
                  'Ova provera ne potvrdjuje lager, cenu ni dimenzije sadnice.',
                  ''
              ]
              if report.get('status') in ('partial_failure', 'failed', 'configuration_or_data_error'):
                  print('::warning::Neki izvori nisu uspesno provereni; pogledajte Summary.')

          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write('\n'.join(lines) + '\n')
          PY

      - name: Proveri osvezen katalog
        run: node scripts/check-catalog.mjs

      - name: Sacuvaj fotografije i evidenciju
        id: commit
        shell: bash
        run: |
          set -euo pipefail

          git add -- data/kataloske-stavke.json docs/fotografije.json
          if [[ -d assets/biljke ]]; then
            git add -- assets/biljke
          fi

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Fotografije i evidencija su nepromenjene; novi commit nije potreban."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: osvezi kataloske fotografije"

          for attempt in 1 2 3; do
            git fetch origin main

            if ! git rebase origin/main; then
              git rebase --abort
              echo "::error::Paralelna izmena je u konfliktu. Main nije prepisan; ponovite proveru posle razresenja."
              exit 1
            fi

            node scripts/check-catalog.mjs

            if git push origin HEAD:main; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "::warning::Push nije uspeo (pokusaj $attempt/3); proveravam novo stanje main."
          done

          echo "::error::Fotografije nisu upisane posle tri pokusaja. Proverite Actions dozvole, zastitu main i paralelne izmene."
          exit 1

  publish:
    needs: update
    if: needs.update.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'

    permissions:
      contents: read
      pages: write
      id-token: write

    uses: ./.github/workflows/deploy.yml
